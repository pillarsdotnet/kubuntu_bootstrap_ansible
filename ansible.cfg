[defaults]
inventory = inventory.yml
# See README "Secrets: Ansible Vault" for creating this password file. The
# secrets themselves live in group_vars/all/vault.yml - under all/, not a
# file named for a group, because Ansible only loads group_vars entries whose
# name matches a group. A top-level vault.yml matched nothing and was
# silently never loaded.
vault_password_file = ~/.ansible/vault_pass
# Facts are read as ansible_facts.<name> only. Leaving this at its default of
# true also injects every fact as a bare top-level ansible_<name> variable,
# which ansible-core deprecates for removal in 2.24 - it warned on
# sources_mail_transport_agent's ansible_all_ipv4_addresses. Setting it false
# now means a top-level fact fails outright instead of warning, so the next one
# cannot be added without noticing. Two kinds of variable keep the prefix and
# are unaffected: connection settings such as ansible_user, ansible_port and
# ansible_host, and ansible_local, which carries facts.d facts and has no
# ansible_facts.local equivalent at all.
inject_facts_as_vars = False
# The hosts all run the same Ubuntu release and carry one python3, so
# discovery picks the right interpreter every time and the warning it prints
# about a future reinstall changing that is noise. auto_silent keeps the
# discovery and drops the warning; it does not pin an interpreter, so a host
# that genuinely needs one sets ansible_python_interpreter in its host_vars.
interpreter_python = auto_silent
# hash_behaviour is deliberately left at its default of "replace". It was set
# to "merge" so host_vars could override a single nested key of a role's
# default dict (sources_repos.common.ubuntu.suites was the example), but no
# host ever did: measured on every host, the two settings produced identical
# variables. The setting is global, applies to every variable source, makes
# the roles unusable outside this repo, and ansible-core intends to remove it.
# So a dict assigned in host_vars now replaces the role default whole. Where a
# host needs to vary one nested key, give that dict an explicit seam rather
# than reaching for the global switch - keep the role default as <name>_base,
# add <name>_overrides defaulting to {}, and compute
# <name>: "{{ <name>_base | combine(<name>_overrides, recursive=True) }}"
# in the role's vars/main.yml, which outranks host_vars.
