---
- name: "Restart Forgejo"
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "forgejo"
    state: "restarted"

- name: "Reload nginx"
  ansible.builtin.systemd_service:
    name: "nginx"
    state: "reloaded"

- name: "Restart the Forgejo runner"
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "forgejo-runner"
    state: "restarted"
