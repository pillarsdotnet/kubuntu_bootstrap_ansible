---
- name: "Reload NetworkManager"
  ansible.builtin.systemd_service:
    name: "NetworkManager.service"
    state: "reloaded"
  tags:
    - "requires_systemd"
  # Both WSL-1 and WSL-2 have their networking owned by Windows, so there is
  # no NetworkManager to reload on either. A VDI that runs Linux natively is
  # a normal Linux host here and does get the reload.
  when: bootstrap_wsl_version | int == 0
- name: "Reload symlink-run-utmp"
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "symlink-run-utmp.service"
  tags:
    - "requires_systemd"
  when: >-
    not (bootstrap_wsl_version | int == 1 and
         'requires_systemd' in wsl1_incompatible_tags)
- name: "Restart bluetooth.service"
  ansible.builtin.systemd_service:
    name: "bluetooth.service"
    state: "restarted"
  tags:
    - "requires_systemd"
  when: >-
    not (bootstrap_wsl_version | int == 1 and
         'requires_systemd' in wsl1_incompatible_tags)
- name: "Restart ssh.service"
  ansible.builtin.systemd_service:
    name: "ssh.service"
    state: "restarted"
  tags:
    - "requires_systemd"
  when: >-
    not (bootstrap_wsl_version | int == 1 and
         'requires_systemd' in wsl1_incompatible_tags)
- name: "Restart ssh.socket"
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "ssh.socket"
    state: "restarted"
  tags:
    - "requires_systemd"
  when: >-
    not (bootstrap_wsl_version | int == 1 and
         'requires_systemd' in wsl1_incompatible_tags)
