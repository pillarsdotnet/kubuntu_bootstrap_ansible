---
- name: "Reload symlink-run-utmp"
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "symlink-run-utmp.service"
- name: "Restart bluetooth.service"
  ansible.builtin.systemd_service:
    name: "bluetooth.service"
    state: "restarted"
- name: "Restart ssh.service"
  ansible.builtin.systemd_service:
    name: "ssh.service"
    state: "restarted"
- name: "Restart ssh.socket"
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "ssh.socket"
    state: "restarted"
