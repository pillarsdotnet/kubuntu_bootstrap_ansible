---
- name: "Gather service facts"
  ansible.builtin.service_facts:
# bootstrap_wsl_version is a role default, computed from ansible_facts.kernel,
# so it is only in scope while roles/bootstrap is running. The later "Setup"
# play in setup.yml runs roles/sources, roles/tailscale, roles/printing
# without roles/bootstrap in scope, so any of those that need to gate on WSL
# would otherwise see 'bootstrap_wsl_version is undefined'. set_fact promotes
# it to a real host fact that survives into those later plays, same as
# bootstrap_gui below.
- name: "Record which WSL generation, if any, this host is running"
  ansible.builtin.set_fact:
    bootstrap_wsl_version: "{{ bootstrap_wsl_version }}"
# "systemctl get-default" answers the wrong question: it reports what the host is
# configured to boot into, not what it is doing. Every host in this fleet -
# including a headless VPS that merely has the desktop metapackages installed -
# reports graphical.target, so that test let a server pull in desktop repos and
# a DisplayLink driver it can never use. A running display manager is the actual
# "there is a GUI on this host right now" signal.
- name: "Record whether a GUI is currently running"
  ansible.builtin.set_fact:
    # display-manager.service is systemd's alias for whichever of sddm/gdm/
    # lightdm the host actually uses, so this needs no per-host unit name. The
    # facts gathered above already carry it - no extra round trip, and nothing
    # for --skip-tags to strip. A host with no display manager installed has no
    # such key at all, and one with no systemd (WSL-1) has no services dict, so
    # both fall through the default to "no GUI". service_facts reports "active"
    # for the alias and "running" for the underlying unit; accept either.
    bootstrap_gui: >-
      {{ ansible_facts.services['display-manager.service'].state
         | default('stopped') in ['active', 'running'] }}
  # set_fact rather than a role default so the value survives into the later
  # plays of setup.yml, where roles/sources runs without roles/bootstrap in
  # scope. Skipped when bootstrap_gui is already set, so a host that runs a GUI
  # without a display manager - or one you simply want treated as headless - can
  # pin it in host_vars/<hostname>.yml and win over the detection above.
  when: bootstrap_gui is not defined
- name: "Ensure a UTF-8 locale is generated and set as default"
  ansible.builtin.include_tasks: "locale.yml"
- name: "Set up ansible user"
  ansible.builtin.include_tasks: "ansible_user.yml"
- name: "Set up sshd server"
  ansible.builtin.include_tasks: "sshd.yml"
- name: "Workaround systemd deprecation of /run/utmp"
  ansible.builtin.include_tasks: "deprecate_run_utmp.yml"
- name: "Enforce BlueZ audio auto-reconnect policy"
  ansible.builtin.include_tasks: "bluetooth.yml"
  when: ansible_facts.services["bluetooth.service"] is defined
- name: "Disable Wi-Fi power-save"
  ansible.builtin.include_tasks: "wifi_powersave.yml"
  when: ansible_facts.services["NetworkManager.service"] is defined
- name: "Ensure the custom facts directory exists"
  ansible.builtin.file:
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
    owner: "root"
    path: "/etc/ansible/facts.d"
    state: "directory"
