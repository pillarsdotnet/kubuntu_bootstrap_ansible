---
bootstrap_bluetooth_auto_enable: "true"
# USB vendor:product of the Bluetooth controller whose runtime power
# management must stay off (see tasks/bluetooth.yml). 8087:0037 is the Intel
# BE201; override in host_vars for a host with a different controller.
bootstrap_bluetooth_controller_usb_id: "8087:0037"
bootstrap_bluetooth_reconnect_attempts: "5"
bootstrap_bluetooth_reconnect_intervals: "1,2,4,8,16"
bootstrap_bluetooth_resume_delay: "2"
# Lower-cased kernel release, used only by bootstrap_wsl_version below. Defaults
# to "" so a play with gather_facts: false reads as "not WSL" instead of failing.
bootstrap_kernel_release: "{{ ansible_facts.kernel | default('') | lower }}"
# "systemd-boot" moves a UEFI host from GRUB to systemd-boot; empty leaves
# the boot loader alone. See tasks/systemd_boot.yml for the two-boot switch.
bootstrap_boot_loader: ""
bootstrap_locale: "en_US.UTF-8"
# Serial ports to put the kernel console and a login prompt on, such as
# ["ttyS0"], so a host that fails to boot can be reached over a null-modem
# cable. The last one listed becomes /dev/console, where an "(initramfs)"
# prompt appears. Empty leaves the host alone. Set it in
# host_vars/<hostname>.yml only for a host with a serial port wired up:
# homelab has ["ttyS4", "ttyS5"] on a CH384 PCI card; racknerd, a VPS, has none.
bootstrap_serial_consoles: []
bootstrap_serial_speed: 115200
bootstrap_ssh_agent_forwarding: "yes"
bootstrap_ssh_password: "no"
bootstrap_ssh_port: 65432
bootstrap_ssh_pubkey: "~/.ssh/id_pillarsdotnet.pub"
bootstrap_ssh_x11_forwarding: "no"
# NetworkManager wifi.powersave: 2 = disable, 3 = enable.
bootstrap_wifi_powersave: "2"
# Whether to pre-create an empty-password login keyring on WSL hosts, so that
# libsecret clients do not raise an unanswerable "choose a password for a new
# keyring" dialog. Set false to leave the keyring alone and accept the prompts;
# see docs/WSL1_COMPATIBILITY.md for the trade-off this makes.
bootstrap_wsl_keyring: true
# Windows/WSLg provide networking, time, hardware and printing for this profile.
# WSL is a client environment by default, not a database/web/container/VM host.
# Override the list for intentional Linux-side servers or hardware passthrough.
# Sockets/paths must be masked too, or they can reactivate stopped services.
bootstrap_wsl_disabled_units:
  - "avahi-daemon.socket"
  - "avahi-daemon.service"
  - "cups.path"
  - "cups.socket"
  - "cups-browsed.service"
  - "cups.service"
  - "docker.socket"
  - "docker.service"
  - "containerd.service"
  - "mariadb.service"
  - "nginx.service"
  - "named.service"
  - "fail2ban.service"
  - "apt-daily-upgrade.timer"
  - "apt-daily-upgrade.service"
  - "unattended-upgrades.service"
  - "libvirtd-admin.socket"
  - "libvirtd-ro.socket"
  - "libvirtd-tcp.socket"
  - "libvirtd-tls.socket"
  - "libvirtd.socket"
  - "libvirt-guests.service"
  - "libvirtd.service"
  - "virtlockd-admin.socket"
  - "virtlockd.socket"
  - "virtlockd.service"
  - "virtlogd-admin.socket"
  - "virtlogd.socket"
  - "virtlogd.service"
  - "chrony-wait.service"
  - "chrony.service"
  - "systemd-timesyncd.service"
  - "getty@tty1.service"
  - "NetworkManager-wait-online.service"
  - "NetworkManager-dispatcher.service"
  - "NetworkManager.service"
  - "networkd-dispatcher.service"
  - "wpa_supplicant.service"
  - "ModemManager.service"
  - "bluetooth.service"
  - "rtkit-daemon.service"
  - "udisks2.service"
# Which WSL this host is, if any: 0 = not WSL, 1 = WSL-1, 2 = WSL-2. WSL-1
# reports a "4.4.0-NNNNN-Microsoft" kernel and WSL-2 a
# "-microsoft-standard-WSL2" one; no native Ubuntu kernel carries either string.
# Compare with "| int" - this renders as a string, not a number.
bootstrap_wsl_version: >-
  {{ 2 if 'wsl2' in bootstrap_kernel_release
     else 1 if 'microsoft' in bootstrap_kernel_release
     else 0 }}
# Capability tags skipped when a WSL-1 kernel is detected. WSL-1 runs Ubuntu
# user-space on the Windows kernel: there is no systemd (so no dbus session bus
# and no graphical target either) and no netfilter. WSL-2 ships a real kernel
# with opt-in systemd, so it is deliberately NOT covered here - only a handful
# of individual tasks/handlers gate WSL-2 directly (NetworkManager reload in
# handlers/main.yml, ufw rules in tasks/sshd.yml), since Windows owns the
# network on both WSL generations regardless of kernel capability.
# Override with -e "bootstrap_wsl1_incompatible_tags=[]" to force the tagged tasks to run.
# These names are the vocabulary; see docs/WSL1_COMPATIBILITY.md for which tasks
# currently carry which tag.
bootstrap_wsl1_incompatible_tags:
  - "requires_dbus"
  - "requires_gui"
  - "requires_netfilter"
  - "requires_systemd"

# Extra IPv4 addresses, in CIDR form, to carry on the primary connection in
# addition to its DHCP lease - for taking over another host's address while
# that host is away. See roles/bootstrap/tasks/ip_alias.yml, which refuses to
# add an address something else is already answering on.
bootstrap_extra_addresses: []

# systemd units this host should not run, by bare name without the .service
# suffix. Stopped, disabled and masked; units that are not installed here are
# reported and skipped. See roles/bootstrap/tasks/disabled_services.yml.
bootstrap_disabled_services: []

# Remove the dependency symlink that makes KDE's crash-handler socket retry
# forever in a system user's session manager. See tasks/drkonqi_uphold.yml for
# the mechanism, the measurement and the upstream bug (KDE 502960, still open).
#
# On by default, and safe on a host that has never seen KDE: the task removes
# a file, so where drkonqi is not installed there is nothing to remove and the
# play reports no change. Set false only to leave the loop in place
# deliberately - for instance while reproducing it for the bug report.
bootstrap_drkonqi_uphold_fix: true

# How often dma retries its mail queue. Empty leaves the packaging alone.
#
# The package ships a systemd timer AND a cron job for this, both every five
# minutes, and on a systemd host the cron one is a guarded no-op that still
# costs a PAM session and about four journal lines each time. Measured on
# acermagic 2026-11-26: roughly 2,000 journal lines a day between the two, for
# a queue that was empty. See tasks/mail_queue.yml.
#
# This governs RETRIES of mail that already failed to send - anything urgent
# goes out directly - so an hour is not a delay anybody notices.
bootstrap_dma_flush_interval: "1h"

# pam-auth-update profiles to keep disabled, by profile name. Empty leaves
# the host's PAM configuration alone.
#
# Empty by default on purpose: this edits the PAM stack, which is the one file
# set where a mistake locks everybody out, so a host opts in rather than
# inheriting it. See tasks/pam_profiles.yml for the mechanism and for why
# kde-kwallet is the profile this was written for.
bootstrap_pam_disabled_profiles: []

# Discard the firewall's blocked-packet messages in rsyslog, keeping the
# kernel's own record in the journal. See tasks/rsyslog_ufw.yml: the packaged
# ufw rule ships its "& stop" commented out, so each dropped packet can land
# in ufw.log, syslog AND kern.log on top of the journal.
bootstrap_rsyslog_discard_ufw: true

# Turn off Ubuntu's telemetry collector for every user. See
# tasks/ubuntu_insights.yml - the collect and upload timers are USER units, so
# this is a --global mask rather than anything system-scoped.
bootstrap_ubuntu_insights_disabled: true

# Repositories whose Origin or Label may change without stopping the run, as a
# list of regular expressions matched against the repository line apt prints.
# EMPTY ON PURPOSE: the default is to leave apt's guard alone and let a blocked
# repository fail loudly. See tasks/apt_releaseinfo.yml for why the apt.conf
# setting is the wrong lever - it is global, so allowing one repository to
# rename itself would allow every Ubuntu mirror to as well.
bootstrap_apt_releaseinfo_allowed: []
