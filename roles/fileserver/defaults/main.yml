---
# Serve SMB shares to Windows machines on the LAN. Off everywhere by default:
# this opens a listening service and creates a writable account, which is not
# something to do to a host that did not ask.
fileserver_enabled: false

# Standalone server, not a domain member. Windows only needs the workgroup to
# match for browsing; it has nothing to do with authentication.
fileserver_workgroup: "WORKGROUP"
fileserver_server_string: "%h fileserver"

# Where share directories are created. On a host whose shares sit on the root
# filesystem, see fileserver_space_* below - the alarm exists because nothing
# else stops a backup run filling / and taking the rest of the host with it.
fileserver_root: "/srv/backup"

# The block device that holds the shares, mounted at fileserver_root before a
# single share directory is created. Empty means the shares live on whatever
# filesystem fileserver_root already sits on, which is homelab's case and the
# reason the free-space alarm below exists at all.
#
# Name it the way fstab does - UUID=, LABEL=, or a /dev/disk/by-id path - and
# never as a bare /dev/sdX. That name is handed out in enumeration order, so
# an unrelated USB stick present at boot can take it and the shares then mount
# whatever did turn up.
#
# This role MOUNTS a filesystem. It never creates one. A device carrying no
# filesystem, or one of a different type, fails the check in tasks/main.yml
# rather than being formatted - because the only thing worse than shares that
# did not mount is empty shares where the backups used to be. Run mkfs by
# hand, once, deliberately, and record what you did.
fileserver_device: ""
fileserver_fstype: "btrfs"
# noatime: nothing here reads access times, and without it every read of a
# backup writes metadata back to a USB disk.
# nofail and the device timeout, because this disk is removable. Unplugged at
# boot it must not drop the host to an emergency shell, and it must not hold
# the boot up for 90 seconds either.
fileserver_mount_options: "defaults,noatime,nofail,x-systemd.device-timeout=30s"

# The accounts allowed in, as a list of {name, password}. Each becomes a
# system user with no shell and no valid shadow password: the Samba password
# lives in Samba's own database, so an account that owns every file written
# through its share still cannot be used to log in to the host.
#
# The passwords have no defaults, because a share reachable with a guessable
# one is worse than no share. Set them in host_vars with
# "ansible-vault encrypt_string".
fileserver_users: []
# The group every share directory belongs to, so a share can be opened to a
# second account later without rewriting ownership.
fileserver_group: "backup"

# Shares, as a list of {name, users} and optionally {comment, path,
# ro_users}. The path defaults to fileserver_root/<name>; "users" names which
# of fileserver_users may read and write, and is also who the directory
# belongs to; "ro_users" names accounts that may connect and read but not
# write.
#
# ro_users is enforced by Samba, through "read list". The directory mode is
# still group-writable, because the share's own account needs that, so an
# ro_users account with shell access on the host - which these accounts
# deliberately do not have - would not be stopped by the filesystem.
#
# One share per purpose AND per machine. Windows Backup overwrites its whole
# target on every run and keeps exactly one system image per location, so two
# machines pointed at one share overwrite each other, and a folder that also
# holds File History's versions loses them.
fileserver_shares: []

# Who may connect at all, as a second gate in front of the password. Empty
# means no restriction, which on a host with a public interface would be a
# mistake. "hosts deny" is set to everything when this is non-empty, because
# an allow list that denies nothing allows everyone.
fileserver_hosts_allow: []

# What the allow list falls back to. Both families are named on purpose:
# 0.0.0.0/0 does not match an IPv6 client, which would then match neither list
# and be allowed, because Samba's default when neither matches is to allow.
# Measured on homelab 2026-11-24 with an IPv4-only pair in place, a connection
# to the host's global IPv6 address listed the shares.
fileserver_hosts_deny:
  - "0.0.0.0/0"
  - "::/0"

# Interfaces smbd binds, with "bind interfaces only". Empty leaves it binding
# everything, which on a host carrying docker and Kubernetes bridges means
# offering the shares on those too.
#
# This restricts by INTERFACE, not by address scope: every address on a listed
# interface is bound, a globally routable IPv6 one included. It is not a
# substitute for the host lists above, and it does not survive an interface
# rename - a host moved from wireless to wired stops serving until this is
# updated.
fileserver_interfaces: []

# Filter the share list down to what the connecting account can actually
# open, which Windows calls Access-Based Enumeration. Samba's own default is
# "no", so every browseable share appears to anyone who authenticates whether
# or not they can get into it; on a role whose model is a share per account
# that is just a confusing list.
#
# Visibility only, not access control: "valid users" and "read list" decide
# who gets in, and a share name is still reachable by typing the path. It
# hides nothing from an account that has at least read access to a share.
fileserver_access_based_enum: true

# SMB1 is off by default in modern Windows and should stay off here. SMB3 adds
# encryption, which "desired" negotiates where the client supports it rather
# than refusing clients that do not.
fileserver_min_protocol: "SMB3"
fileserver_encrypt: "desired"

# Make the host appear in a Windows Explorer "Network" listing. Windows 10 and
# 11 dropped the NetBIOS browsing that nmbd provides, and use WS-Discovery
# instead, so without this the share works but has to be typed in by address.
fileserver_wsdd: true
# Which interface wsdd advertises on. Empty means every interface, which on a
# host carrying docker and Kubernetes bridges means advertising into container
# networks too - harmless, but noisy. Name the LAN interface to avoid it.
fileserver_wsdd_interface: ""

# Consolidate one share's contents into another as timestamped snapshots, as
# a list of {source, dest} naming shares from fileserver_shares. Empty
# installs nothing at all.
#
# This is consolidation, not redundancy: both copies land on the same
# filesystem. On a host whose volume group is a linear span with no parity,
# one drive failure takes the original and every snapshot together. It guards
# against a machine losing its own backup, not against this host losing a disk.
fileserver_replicate: []
fileserver_replicate_interval: "hourly"
# How long the source must have been untouched before it is copied.
fileserver_replicate_quiet_minutes: 15
# Snapshots kept per destination, pruned oldest first.
fileserver_replicate_keep: 3
# A new snapshot is refused below this much free space rather than started.
fileserver_replicate_min_free_gb: 500

# Warn before the filesystem holding the shares fills. A timer rather than a
# quota because this host's volume group has no free extents and its ext4 has
# no quota feature enabled, so there is no way to bound the share's size
# without restructuring the storage. The unit FAILS when space runs low, so a
# missed warning still shows up in "systemctl --failed" rather than scrolling
# past in a log.
fileserver_space_alarm: true
fileserver_space_min_free_gb: 500
fileserver_space_check_interval: "hourly"

# Deduplicate the shares nightly with duperemove, on a filesystem that can
# share extents between files. That means btrfs here; nothing else in this
# estate does reflinks.
#
# This is the setting that lets one disk hold more than one disk's worth of
# Windows backups. wbadmin rewrites its entire system image on every run, so
# consecutive images are overwhelmingly the same blocks under a different
# name - exactly the case hardlinking cannot catch, because no two files are
# identical in full, and block-level dedup can. File History is the same
# story at a smaller granularity.
#
# Off by default. It is pointless without reflinks, and it rewrites extent
# metadata across every byte of the share, which is not something to do to a
# host that did not ask for it.
fileserver_dedupe_enabled: false
# Nightly, at the quietest hour: Windows Backup on these machines runs in the
# evening and File History hourly through the day. The randomised delay keeps
# two hosts that both adopt this from starting in the same minute.
fileserver_dedupe_interval: "03:00"
fileserver_dedupe_randomized_delay: "30min"
# What to deduplicate. Empty means fileserver_root, which is every share.
fileserver_dedupe_paths: []
# Where duperemove keeps its extent hashes between runs.
#
# Not a cache to be discarded casually: without it every run rehashes every
# byte of every share, which on a USB disk is hours, and with it a run reads
# only what changed since the last one. It lives outside fileserver_root
# deliberately - inside, it would be part of the data being deduplicated, and
# it would also appear in whichever share it landed in.
fileserver_dedupe_hashfile: "/var/lib/duperemove/hashfile.db"
# The block size duperemove hashes and compares at. Larger means a smaller
# hashfile and a shorter run, at the cost of missing matches that do not
# happen to align; 128K is duperemove's own default and the right starting
# point for whole-disk images. Raise it if the hashfile outgrows its room.
fileserver_dedupe_blocksize: "128K"
# Give up rather than run into the working day. A nightly run that cannot
# finish inside this is not keeping up, and a failed unit is how that gets
# noticed - instead of two runs overlapping on one hashfile, which the lock
# in the script refuses anyway.
fileserver_dedupe_timeout: "6h"
