---
# Serve SMB shares to Windows machines on the LAN.
#
# One share per purpose, not one shared folder. Windows Backup (wbadmin)
# overwrites its whole target directory on every run and keeps exactly one
# system image per location, so pointing it at a folder that also holds File
# History's versions would have it delete them. File History, in turn, manages
# its own per-user versioning and wants a folder nothing else writes to.
#
# What this role does NOT do is bound the size of those shares, because on
# this host it cannot: the volume group has no free extents, so there is no
# room for a volume of their own, and the root filesystem was created without
# the quota feature, so project quotas are unavailable too. The shares
# therefore share a filesystem with / - including Forgejo and Kubernetes - and
# the free-space timer at the end is the compensating control. It is a warning,
# not a limit, and the difference matters.

- name: "Serve SMB shares to the LAN"
  when: "fileserver_enabled | bool"
  block:
    - name: "Check every account has a password and every share has an account"
      ansible.builtin.assert:
        that:
          - "fileserver_users | length > 0"
          - "fileserver_shares | length > 0"
          - "fileserver_users | rejectattr('password', 'defined') | list | length == 0"
          - "fileserver_users | map(attribute='password') | select('equalto', '') | list | length == 0"
          - >-
            fileserver_shares | map(attribute='users') | flatten | unique
            | difference(fileserver_users | map(attribute='name') | list)
            | length == 0
          - >-
            fileserver_shares | selectattr('ro_users', 'defined')
            | map(attribute='ro_users') | flatten | unique
            | difference(fileserver_users | map(attribute='name') | list)
            | length == 0
          # The outer parentheses matter: Jinja binds a filter tighter than
          # "+", so without them the concatenation swallows the comparison and
          # fails with "can only concatenate list (not int) to list".
          - >-
            (
              (fileserver_replicate | map(attribute='source') | list)
              + (fileserver_replicate | map(attribute='dest') | list)
            ) | unique
            | difference(fileserver_shares | map(attribute='name') | list)
            | length == 0
        fail_msg: >-
          fileserver_enabled is true but fileserver_users or fileserver_shares
          is unset, an account has no password, or a share names an account
          that does not exist. A writable share reachable with a guessable
          password is worse than no share, so passwords have no defaults; set
          them with "ansible-vault encrypt_string".
        success_msg: "Every account has a password and every share has an account"

    # Before anything creates a directory under fileserver_root. The other
    # order is a trap: create the share directories first and the mount then
    # hides them, which presents as "the backups are gone" when in fact they
    # were written to the disk underneath and are still sitting there,
    # unreachable, taking up the room the shares now need.
    - name: "Mount the filesystem that holds the shares"
      when: "fileserver_device | length > 0"
      block:
        # findfs resolves all three spellings - UUID=, LABEL= and a device
        # path - so the check works whichever one host_vars used.
        - name: "Find the device the shares live on"
          ansible.builtin.command:
            argv: ["findfs", "{{ fileserver_device }}"]
          changed_when: false
          failed_when: false
          register: "fileserver_findfs"
          check_mode: false

        - name: "Refuse to serve shares when their disk is not attached"
          ansible.builtin.assert:
            fail_msg: >-
              fileserver_device is {{ fileserver_device }} and nothing on this
              host answers to it. The disk is unplugged, renamed, or failed.
              Serving the shares anyway would create them on the root
              filesystem instead, which is how a backup target silently
              becomes a way to fill /.
            quiet: true
            that:
              - "fileserver_findfs.rc == 0"
              - "fileserver_findfs.stdout | trim | length > 0"

        - name: "Read the filesystem already on it"
          ansible.builtin.command:
            argv:
              - "blkid"
              - "-o"
              - "value"
              - "-s"
              - "TYPE"
              - "{{ fileserver_findfs.stdout | trim }}"
          changed_when: false
          failed_when: false
          register: "fileserver_blkid"
          check_mode: false

        # This role mounts and never formats. A device carrying the wrong
        # filesystem, or none, is a mistake to report rather than a disk to
        # overwrite - there is no way to tell "the new disk I meant to set up"
        # from "the wrong disk, holding the only copy of something".
        - name: "Refuse to serve shares from a disk this role would have to format"
          ansible.builtin.assert:
            fail_msg: >-
              {{ fileserver_device }} resolves to
              {{ fileserver_findfs.stdout | trim }}, which carries
              "{{ fileserver_blkid.stdout | trim | default('no filesystem', true) }}"
              rather than {{ fileserver_fstype }}. This role will not create a
              filesystem: run mkfs by hand if that is really the disk you mean,
              and note what was on it first.
            quiet: true
            that:
              - "fileserver_blkid.stdout | trim == fileserver_fstype"

        - name: "Mount it where the shares are served from"
          ansible.posix.mount:
            fstype: "{{ fileserver_fstype }}"
            opts: "{{ fileserver_mount_options }}"
            path: "{{ fileserver_root }}"
            src: "{{ fileserver_device }}"
            state: "mounted"

        # Belt and braces, and it has a real failure mode behind it: with
        # "nofail" in the options a mount that did not happen is not an error
        # anywhere else, so without this check the run would carry on and
        # write the shares to the root filesystem.
        - name: "Read back what is actually mounted there"
          ansible.builtin.command:
            argv:
              - "findmnt"
              - "--noheadings"
              - "--output"
              - "SOURCE"
              - "--target"
              - "{{ fileserver_root }}"
          changed_when: false
          failed_when: false
          register: "fileserver_findmnt"
          check_mode: false

        - name: "Confirm the shares sit on the disk and not on the one underneath"
          ansible.builtin.assert:
            fail_msg: >-
              {{ fileserver_root }} is served by
              "{{ fileserver_findmnt.stdout | trim }}", not by
              {{ fileserver_findfs.stdout | trim }}. The mount did not take.
            quiet: true
            that:
              - >-
                fileserver_findmnt.stdout | trim
                == fileserver_findfs.stdout | trim

    - name: "Install the server"
      ansible.builtin.apt:
        name: >-
          {{ ['samba']
             + (['wsdd'] if (fileserver_wsdd | bool) else [])
             + (['rsync'] if (fileserver_replicate | length > 0) else [])
             + (['btrfs-progs'] if (fileserver_snapshot | length > 0) else [])
             + (['duperemove'] if (fileserver_dedupe_enabled | bool) else []) }}
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: "Create the group that owns the shares"
      ansible.builtin.group:
        name: "{{ fileserver_group }}"
        system: true

    # No shell and no valid password hash: the Samba password lives in Samba's
    # own database, so this account cannot be used to log in to the host even
    # though it owns every file written through the share.
    - name: "Create the accounts the shares run as"
      ansible.builtin.user:
        name: "{{ item.name }}"
        group: "{{ fileserver_group }}"
        system: true
        shell: "/usr/sbin/nologin"
        home: "{{ fileserver_root }}"
        create_home: false
        # "!" is a locked hash, not a password: nothing can satisfy it, so the
        # account has no route in except through Samba's own database.
        password: "!"
      loop: "{{ fileserver_users }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: "Create the share directories"
      ansible.builtin.file:
        path: "{{ item.path | default(fileserver_root + '/' + item.name) }}"
        state: "directory"
        # The first account named by the share. With one account per machine
        # that is simply its owner; a share opened to several relies on the
        # group and the masks in smb.conf instead.
        owner: "{{ item.users[0] }}"
        group: "{{ fileserver_group }}"
        # Not world-readable: these are backups of somebody's whole machine.
        mode: "0770"
      loop: "{{ fileserver_shares }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Write the configuration"
      ansible.builtin.template:
        src: "smb.conf.j2"
        dest: "/etc/samba/smb.conf"
        owner: "root"
        group: "root"
        mode: "0644"
        # smbd refuses to start on a bad file, so validating here turns a
        # broken share into a failed task rather than a dead service.
        validate: "testparm -s %s"
      notify:
        - "Restart the SMB server"
        - "Restart the NetBIOS name server"

    # pdbedit is the idempotence check, in the same step as the write so the
    # two cannot disagree: smbpasswd would otherwise reset the password on
    # every run, reporting a change where nothing changed. The password goes
    # through the environment rather than the command line so it is not
    # visible in ps, and the task is hidden so it is not echoed into the log.
    - name: "Create the Samba accounts"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if pdbedit --list --user={{ item.name }} >/dev/null 2>&1; then
            echo "exists"
          else
            printf '%s\n%s\n' "$FILESERVER_PASSWORD" "$FILESERVER_PASSWORD" \
              | smbpasswd -s -a {{ item.name }} >/dev/null
            echo "created"
          fi
        executable: "/bin/bash"
      environment:
        FILESERVER_PASSWORD: "{{ item.password }}"
      loop: "{{ fileserver_users }}"
      loop_control:
        label: "{{ item.name }}"
      register: "fileserver_smbpasswd"
      changed_when: "'created' in (fileserver_smbpasswd.stdout | default(''))"
      no_log: true

    - name: "Enable the SMB and NetBIOS services"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - "smbd.service"
        - "nmbd.service"

    # Windows 10 and 11 no longer browse by NetBIOS, so without this the share
    # works but never appears under "Network" and has to be typed in by
    # address. nmbd is kept anyway: it costs nothing and older clients use it.
    # The package ships /usr/bin/wsdd and no unit whatsoever - verified on
    # homelab 2026-11-24, where "systemctl list-unit-files '*wsd*'" returned
    # nothing and dpkg -L listed no .service file - so the unit comes from
    # here rather than from the package.
    - name: "Install the WS-Discovery unit the package does not ship"
      ansible.builtin.template:
        src: "wsdd.service.j2"
        dest: "/etc/systemd/system/wsdd.service"
        owner: "root"
        group: "root"
        mode: "0644"
      when: "fileserver_wsdd | bool"
      notify:
        - "Reload systemd timers"
        - "Restart WS-Discovery"

    - name: "Reload systemd so the new unit is visible before it is started"
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: "fileserver_wsdd | bool"
      changed_when: false

    - name: "Enable WS-Discovery so Windows can find the host"
      ansible.builtin.systemd_service:
        name: "wsdd.service"
        enabled: true
        state: started
      when: "fileserver_wsdd | bool"

    # smbd binds the addresses that exist at the moment it starts, and naming
    # interfaces above also set "bind interfaces only", so there is no
    # wildcard socket to catch one that arrives later. On a host addressed by
    # DHCP or an RA that is a race, and acermagic lost it on 2026-11-25 by one
    # second. Nothing is installed where there is nothing to race: with no
    # interfaces listed, smbd already holds a wildcard socket.
    - name: "Rebind smbd when an interface gains an address"
      when:
        - "fileserver_rebind_hook | bool"
        - "fileserver_interfaces | length > 0"
      block:
        - name: "Install the rebind script"
          ansible.builtin.copy:
            dest: "/usr/local/sbin/fileserver-rebind"
            group: "root"
            mode: "0755"
            owner: "root"
            src: "fileserver-rebind"

        # dispatcher.d proper, because no-wait.d is never read - see the
        # measurement in the template. NetworkManager also skips a dispatcher
        # script that is not executable, or that anyone but root can write, in
        # both cases without a word anywhere, hence the explicit owner and
        # mode.
        - name: "Install the NetworkManager dispatcher hook"
          ansible.builtin.template:
            dest: "/etc/NetworkManager/dispatcher.d/50-fileserver-rebind"
            group: "root"
            mode: "0755"
            owner: "root"
            src: "fileserver-rebind.j2"

        # Where this hook used to live, and was never once executed.
        - name: "Remove the hook from the directory NetworkManager ignores"
          ansible.builtin.file:
            path: "/etc/NetworkManager/dispatcher.d/no-wait.d/50-fileserver-rebind"
            state: "absent"

        # D-Bus activated, so it is normally not running and that is correct.
        # It still has to be enabled, or no hook ever runs.
        - name: "Enable the dispatcher that runs the hook"
          ansible.builtin.systemd_service:
            enabled: true
            name: "NetworkManager-dispatcher.service"

        # The hook fixes the next event; this fixes the current boot, so a
        # setup run does not leave a host serving fewer addresses than it
        # should until something happens on the network.
        #
        # No "check_mode: false" here, deliberately. The command module skips
        # itself under --check, which is what is wanted: with that override it
        # ran for real against a host where the script above had only been
        # simulated, and failed on a file that was never written.
        - name: "Bind any address smbd came up without"
          ansible.builtin.command:
            argv:
              - "/usr/local/sbin/fileserver-rebind"
              - "--interfaces"
              - "{{ fileserver_interfaces | join(' ') }}"
              - "--unit"
              - "smbd.service"
              - "--settle"
              - "{{ fileserver_rebind_settle_seconds }}"
              - "--when-busy"
              - "{{ fileserver_rebind_when_busy }}"
              - "--boot-grace"
              - "{{ fileserver_rebind_boot_grace_seconds }}"
          changed_when: "'restarted' in fileserver_rebind_run.stdout"
          register: "fileserver_rebind_run"

    - name: "Install the free-space check"
      ansible.builtin.copy:
        src: "fileserver-space-check"
        dest: "/usr/local/sbin/fileserver-space-check"
        owner: "root"
        group: "root"
        mode: "0755"
      when: "fileserver_space_alarm | bool"

    - name: "Install the free-space units"
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - "fileserver-space-check.service"
        - "fileserver-space-check.timer"
      when: "fileserver_space_alarm | bool"
      notify: "Reload systemd timers"

    - name: "Flush the restarts before testing the shares"
      ansible.builtin.meta: "flush_handlers"

    # Creating an account is not the same as keeping its password current. The
    # pdbedit guard above deliberately will not touch an account that exists,
    # because otherwise every run would reset the password and report a change
    # where nothing changed - but that also meant a changed value in host_vars
    # was written to the vault and never reached the host, so the file said one
    # thing and the share accepted another.
    #
    # So the configured password is tested the way a client tests it, and reset
    # only when it does not work. That is what makes host_vars authoritative:
    # change the vaulted value, re-run the role, and the account follows.
    - name: "Does each account's stored password match the configured one?"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          if smbclient -L localhost
          -U {{ item.name }}%"$FILESERVER_PASSWORD"
          --option='client min protocol=SMB3' >/dev/null 2>&1;
          then echo matches; else echo differs; fi
        executable: "/bin/bash"
      environment:
        FILESERVER_PASSWORD: "{{ item.password }}"
      loop: "{{ fileserver_users }}"
      loop_control:
        label: "{{ item.name }}"
      register: "fileserver_pwcheck"
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: "Reset a password that no longer matches host_vars"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          printf '%s\n%s\n' "$FILESERVER_PASSWORD" "$FILESERVER_PASSWORD"
          | smbpasswd -s -a {{ item.item.name }} >/dev/null
        executable: "/bin/bash"
      environment:
        FILESERVER_PASSWORD: "{{ item.item.password }}"
      loop: "{{ fileserver_pwcheck.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: "'differs' in (item.stdout | default(''))"
      changed_when: true
      no_log: true

    - name: "Enable the free-space timer"
      ansible.builtin.systemd_service:
        name: "fileserver-space-check.timer"
        enabled: true
        state: started
      when: "fileserver_space_alarm | bool"

    # Nothing here runs on a host that configured no pairs, so the script and
    # its units are absent rather than installed and inert.
    - name: "Install the consolidation script"
      ansible.builtin.copy:
        src: "fileserver-replicate"
        dest: "/usr/local/sbin/fileserver-replicate"
        owner: "root"
        group: "root"
        mode: "0755"
      when: "fileserver_replicate | length > 0"

    # No handler: the script sources this on each run, so a changed threshold
    # takes effect at the next firing without restarting anything.
    - name: "Write the consolidation policy"
      ansible.builtin.template:
        src: "fileserver-replicate.conf.j2"
        dest: "/etc/fileserver-replicate.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      when: "fileserver_replicate | length > 0"

    - name: "Install the consolidation units"
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - "fileserver-replicate.service"
        - "fileserver-replicate.timer"
      when: "fileserver_replicate | length > 0"
      notify: "Reload systemd timers"

    - name: "Reload systemd so the consolidation units are visible"
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: "fileserver_replicate | length > 0"
      changed_when: false

    - name: "Enable the consolidation timer"
      ansible.builtin.systemd_service:
        name: "fileserver-replicate.timer"
        enabled: true
        state: started
      when: "fileserver_replicate | length > 0"

    # A host that has moved to snapshots would otherwise keep an hourly timer
    # running against a policy file that no longer names any pairs. It exits 0
    # and does nothing, which is the kind of thing that goes unnoticed for a
    # year. The snapshots it already wrote are data and are left alone.
    - name: "Remove the consolidation once it is no longer configured"
      when: "fileserver_replicate | length == 0"
      block:
        - name: "Look for a consolidation timer left from before"
          ansible.builtin.stat:
            path: "/etc/systemd/system/fileserver-replicate.timer"
          register: "fileserver_replicate_leftover"

        - name: "Stop and disable it"
          ansible.builtin.systemd_service:
            enabled: false
            name: "fileserver-replicate.timer"
            state: "stopped"
          when: "fileserver_replicate_leftover.stat.exists"

        - name: "Remove its units, its policy and its script"
          ansible.builtin.file:
            path: "{{ item }}"
            state: "absent"
          loop:
            - "/etc/systemd/system/fileserver-replicate.timer"
            - "/etc/systemd/system/fileserver-replicate.service"
            - "/etc/fileserver-replicate.conf"
            - "/usr/local/sbin/fileserver-replicate"
          notify: "Reload systemd timers"

    # Nothing here is installed on a host that did not ask for it, so the
    # script and its units are absent rather than present and inert.
    - name: "Keep a read-only snapshot history of the shares"
      when: "fileserver_snapshot | length > 0"
      block:
        - name: "Read the filesystem the shares actually sit on"
          ansible.builtin.command:
            argv: ["findmnt", "-no", "FSTYPE", "--target", "{{ fileserver_root }}"]
          changed_when: false
          register: "fileserver_snapshot_fstype"
          check_mode: false

        # Measured rather than taken from fileserver_fstype, which describes
        # the device this role mounts and says nothing on a host where the
        # shares sit on a filesystem somebody else mounted.
        - name: "Check the shares can be snapshotted at all"
          ansible.builtin.assert:
            fail_msg: >-
              fileserver_snapshot is set, but {{ fileserver_root }} is on
              "{{ fileserver_snapshot_fstype.stdout | trim }}" rather than
              btrfs, or it names a share that is not in fileserver_shares.
              Snapshots need a filesystem that can take them; on anything else
              use fileserver_replicate.
            quiet: true
            that:
              - "fileserver_snapshot_fstype.stdout | trim == 'btrfs'"
              - >-
                fileserver_snapshot
                | difference(fileserver_shares | map(attribute='name') | list)
                | length == 0

        - name: "Work out where each share to snapshot lives"
          ansible.builtin.set_fact:
            fileserver_snapshot_paths: >-
              {{ (fileserver_snapshot_paths | default([])) + [share_path] }}
          loop: "{{ fileserver_snapshot }}"
          vars:
            share_path: >-
              {{ (fileserver_shares | selectattr('name', 'equalto', item)
                  | first).path | default(fileserver_root ~ '/' ~ item) }}

        # Root-only and outside every share. The snapshots are read-only and
        # would be safe to expose, but nothing needs them to be.
        - name: "Create the directory the histories live in"
          ansible.builtin.file:
            group: "root"
            mode: "0700"
            owner: "root"
            path: "{{ fileserver_snapshot_dir }}"
            state: "directory"

        # btrfs can only snapshot a subvolume, and the shares were created as
        # plain directories. Converting one that holds data means moving that
        # data, which is not something a config run should do behind your
        # back - so an empty share is converted and a populated one is only
        # reported. The script says so again on every run until it is done.
        - name: "Install the subvolume conversion helper"
          ansible.builtin.copy:
            dest: "/usr/local/sbin/fileserver-subvol"
            group: "root"
            mode: "0755"
            owner: "root"
            src: "fileserver-subvol"

        # Without --move it converts an empty directory and only REPORTS one
        # that holds data, which is the whole point: moving somebody's backups
        # is not something a config run should decide to do.
        - name: "Convert an empty share directory into a subvolume"
          ansible.builtin.command:
            argv:
              - "/usr/local/sbin/fileserver-subvol"
              - "--path"
              - "{{ item }}"
          changed_when: >-
            'converted' in (fileserver_snapshot_convert.stdout | default(''))
          loop: "{{ fileserver_snapshot_paths }}"
          register: "fileserver_snapshot_convert"

        - name: "Say which shares still have to be converted by hand"
          ansible.builtin.debug:
            msg: >-
              {{ item.item }} holds data and is not a subvolume, so it has no
              snapshot history yet. Convert it in a window when nothing is
              writing to it, with "fileserver-subvol --path {{ item.item }}
              --move" - it reflinks, so it costs no space and no time, leaves
              the original beside it as the undo, and refuses while a client
              has the share open. The timer reports this every run until then.
          loop: "{{ fileserver_snapshot_convert.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: "'needs-move' in (item.stdout | default(''))"

        - name: "Install the snapshot script"
          ansible.builtin.copy:
            dest: "/usr/local/sbin/fileserver-snapshot"
            group: "root"
            mode: "0755"
            owner: "root"
            src: "fileserver-snapshot"

        # No handler: the script sources this on each run, so a changed
        # threshold takes effect at the next firing without restarting
        # anything.
        - name: "Write the snapshot policy"
          ansible.builtin.template:
            dest: "/etc/fileserver-snapshot.conf"
            group: "root"
            mode: "0644"
            owner: "root"
            src: "fileserver-snapshot.conf.j2"

        - name: "Install the snapshot units"
          ansible.builtin.template:
            dest: "/etc/systemd/system/{{ item }}"
            group: "root"
            mode: "0644"
            owner: "root"
            src: "{{ item }}.j2"
          loop:
            - "fileserver-snapshot.service"
            - "fileserver-snapshot.timer"
          notify: "Reload systemd timers"

        - name: "Reload systemd so the snapshot units are visible"
          ansible.builtin.systemd_service:
            daemon_reload: true
          changed_when: false

        - name: "Enable the snapshot timer"
          ansible.builtin.systemd_service:
            enabled: true
            name: "fileserver-snapshot.timer"
            state: "started"

    # Nothing here is installed on a host that did not ask for it, so the
    # script and its units are absent rather than present and inert.
    - name: "Deduplicate the shares nightly"
      when: "fileserver_dedupe_enabled | bool"
      block:
        - name: "Install the deduplication script"
          ansible.builtin.copy:
            dest: "/usr/local/sbin/fileserver-dedupe"
            group: "root"
            mode: "0755"
            owner: "root"
            src: "fileserver-dedupe"

        # Outside the shares on purpose - see the note in defaults. Root-only
        # because it is a map of what is stored in somebody's backups, even
        # though it holds none of the contents.
        - name: "Create the directory the hashfile lives in"
          ansible.builtin.file:
            group: "root"
            mode: "0700"
            owner: "root"
            path: "{{ fileserver_dedupe_hashfile | dirname }}"
            state: "directory"

        - name: "Install the deduplication units"
          ansible.builtin.template:
            dest: "/etc/systemd/system/{{ item }}"
            group: "root"
            mode: "0644"
            owner: "root"
            src: "{{ item }}.j2"
          loop:
            - "fileserver-dedupe.service"
            - "fileserver-dedupe.timer"
          notify: "Reload systemd timers"

        - name: "Reload systemd so the deduplication units are visible"
          ansible.builtin.systemd_service:
            daemon_reload: true
          changed_when: false

        - name: "Enable the deduplication timer"
          ansible.builtin.systemd_service:
            enabled: true
            name: "fileserver-dedupe.timer"
            state: "started"

    # Everything above can succeed while a share is unreachable - a wrong
    # password, a path smbd cannot enter, a global that testparm accepts and
    # smbd ignores, an account that exists in Unix but not in Samba. So
    # connect as one of each share's own accounts and list the server, which
    # is the same operation Windows performs first.
    - name: "List the server as one of each share's own accounts"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          smbclient -L localhost -U {{ item.users[0] }}%"$FILESERVER_PASSWORD"
          --option='client min protocol=SMB3' 2>&1
      environment:
        FILESERVER_PASSWORD: >-
          {{ (fileserver_users | selectattr('name', 'equalto', item.users[0])
              | first).password }}
      loop: "{{ fileserver_shares }}"
      loop_control:
        label: "{{ item.name }}"
      register: "fileserver_listing"
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: "Confirm every share is reachable with one of its own accounts"
      ansible.builtin.assert:
        that: "item.item.name in (item.stdout | default(''))"
        fail_msg: >-
          Share "{{ item.item.name }}" did not appear when listing the server
          as {{ item.item.users[0] }}. smbd is running but the share is not
          usable by the account that owns it.
        success_msg: >-
          Share {{ item.item.name }} is reachable as {{ item.item.users[0] }}
      loop: "{{ fileserver_listing.results }}"
      loop_control:
        label: "{{ item.item.name }}"
