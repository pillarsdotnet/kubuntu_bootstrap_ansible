---
- name: "Apply common k8s node prerequisites"
  when: "'kubernetes' in group_names"
  ansible.builtin.include_tasks: "common.yml"

- name: "Initialize control plane"
  when: "'cp' in group_names"
  ansible.builtin.include_tasks: "control_plane.yml"

- name: "Remove control-plane taint to allow worker pods"
  when:
    - "'cp' in group_names"
    - "'worker' in group_names"
  ansible.builtin.command: >-
    kubectl taint nodes {{ inventory_hostname }}
    node-role.kubernetes.io/control-plane:NoSchedule-
  environment:
    KUBECONFIG: "/etc/kubernetes/admin.conf"
  register: taint_result
  changed_when: "'untainted' in taint_result.stdout"
  failed_when:
    - taint_result.rc != 0
    - "'not found' not in taint_result.stderr"

- name: "Join as worker node"
  when:
    - "'worker' in group_names"
    - "'cp' not in group_names"
  ansible.builtin.include_tasks: "worker.yml"
