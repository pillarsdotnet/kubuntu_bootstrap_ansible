---
- name: "Ensure /etc/kubernetes directory exists"
  ansible.builtin.file:
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
    owner: "root"
    path: "/etc/kubernetes"
    state: "directory"

- name: "Ensure /etc/containerd directory exists"
  ansible.builtin.file:
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
    owner: "root"
    path: "/etc/containerd"
    state: "directory"

- name: "Generate default containerd config"
  ansible.builtin.command: "containerd config default"
  register: containerd_default_config
  changed_when: false

- name: "Write default containerd config if absent"
  ansible.builtin.copy:
    content: "{{ containerd_default_config.stdout }}"
    dest: "/etc/containerd/config.toml"
    force: false
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"

- name: "Enable SystemdCgroup in containerd config"
  ansible.builtin.replace:
    path: "/etc/containerd/config.toml"
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"
  notify: "Restart containerd"

- name: "Flush handlers to restart containerd before kubelet starts"
  ansible.builtin.meta: "flush_handlers"

- name: "Ensure kubelet systemd override directory exists"
  ansible.builtin.file:
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
    owner: "root"
    path: "/etc/systemd/system/kubelet.service.d"
    state: "directory"

- name: "Configure kubelet to swap around swap and start after tailscaled"
  ansible.builtin.copy:
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
      [Service]
      ExecStartPre=-/sbin/swapoff -a
      ExecStopPost=-/sbin/swapon -a
      PermissionsStartOnly=true
    dest: "/etc/systemd/system/kubelet.service.d/override.conf"
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"
  notify: "Reload kubelet"

- name: "Configure kernel modules to load on boot"
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: "/etc/modules-load.d/k8s.conf"
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"

- name: "Load kernel modules now"
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop:
    - "overlay"
    - "br_netfilter"

- name: "Configure sysctl settings for k8s networking"
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    dest: "/etc/sysctl.d/k8s.conf"
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"

- name: "Apply sysctl settings"
  ansible.builtin.command: "sysctl --system"
  changed_when: false

- name: "Get tailscale IPv4 address"
  ansible.builtin.command: "tailscale ip -4"
  register: tailscale_ip_result
  changed_when: false

- name: "Set tailscale_ip fact"
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout | trim }}"
    cacheable: true
