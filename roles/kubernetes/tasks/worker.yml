---
- name: "Find first control plane host"
  ansible.builtin.set_fact:
    cp_host: "{{ groups['cp'] | first }}"

- name: "Check if node is already joined"
  ansible.builtin.stat:
    path: "/etc/kubernetes/kubelet.conf"
  register: kubeadm_join_check

- name: "Reset iptables before joining to remove old CNI and kube-proxy chains"
  when: "not kubeadm_join_check.stat.exists"
  ansible.builtin.shell: |
    kubeadm reset -f 2>/dev/null || true
    for table in nat mangle filter; do
      iptables -t $table -F 2>/dev/null || true
      iptables -t $table -X 2>/dev/null || true
    done
  changed_when: false

- name: "Accept Tailscale subnet routes"
  ansible.builtin.command: "tailscale set --accept-routes"
  changed_when: false

- name: "Add iptables DNAT rules to redirect VIP to active control plane"
  ansible.builtin.iptables:
    table: nat
    chain: "{{ item }}"
    destination: "{{ kubernetes_vip }}"
    protocol: tcp
    destination_port: "6443"
    jump: DNAT
    to_destination: "{{ hostvars[cp_host]['tailscale_ip'] }}:6443"
    comment: "k8s VIP redirect"
  loop:
    - "OUTPUT"
    - "PREROUTING"

- name: "Ensure /etc/iptables directory exists"
  ansible.builtin.file:
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
    owner: "root"
    path: "/etc/iptables"
    state: "directory"

- name: "Save iptables rules for boot restoration"
  ansible.builtin.shell:
    cmd: "iptables-save > /etc/iptables/rules.v4"
  changed_when: false

- name: "Create systemd unit to restore iptables rules on boot"
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Restore iptables rules for k8s VIP redirect
      After=tailscaled.service
      Wants=tailscaled.service
      Before=kubelet.service
      [Service]
      Type=oneshot
      ExecStart=/sbin/iptables-restore --noflush /etc/iptables/rules.v4
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
    dest: "/etc/systemd/system/k8s-iptables-restore.service"
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"
  notify: "Enable k8s-iptables-restore"

- name: "Wait for control plane VIP to be reachable"
  ansible.builtin.wait_for:
    host: "{{ kubernetes_vip }}"
    port: 6443
    timeout: 60

- name: "Create join token on control plane"
  ansible.builtin.command: "kubeadm token create"
  register: join_token_result
  delegate_to: "{{ cp_host }}"
  changed_when: true

- name: "Get CA certificate hash from control plane"
  ansible.builtin.shell:
    cmd: >-
      openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt
      | openssl rsa -pubin -outform der 2>/dev/null
      | openssl dgst -sha256 -hex
      | sed 's/.* //'
  register: ca_cert_hash_result
  delegate_to: "{{ cp_host }}"
  changed_when: false

- name: "Write kubeadm join config"
  ansible.builtin.template:
    src: "kubeadm-join.yaml.j2"
    dest: "/etc/kubernetes/kubeadm-join.yaml"
    group: "root"
    mode: "u=rw,g=,o="
    owner: "root"

- name: "Check if node is already joined"
  ansible.builtin.stat:
    path: "/etc/kubernetes/kubelet.conf"
  register: kubeadm_join_done

- name: "Join the cluster"
  ansible.builtin.command: "kubeadm join --config /etc/kubernetes/kubeadm-join.yaml"
  when: "not kubeadm_join_done.stat.exists"
