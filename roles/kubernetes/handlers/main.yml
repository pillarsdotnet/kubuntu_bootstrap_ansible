---
- name: "Reload kubelet"
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "kubelet"

- name: "Restart containerd"
  ansible.builtin.systemd_service:
    name: "containerd"
    state: "restarted"

- name: "Restart systemd-networkd"
  ansible.builtin.systemd_service:
    name: "systemd-networkd"
    state: "restarted"
