---

# Terminal setup for the desktop user, configured 2026-10-16:
#
#  - foot opens fullscreen at Hack 29pt (83 columns, so emacs shows 80 text
#    columns beside its 3-column line-number gutter - the same grid fullscreen
#    Konsole yields at 24pt; foot renders a given point size smaller) and
#    attaches to the persistent zellij session "main".
#  - foot runs in server mode (since 2026-10-16): the foot package globally
#    enables foot-server.socket/.service in
#    /etc/systemd/user/graphical-session.target.wants/, so every graphical
#    login socket-activates "foot --server" and new windows come from
#    footclient. Nothing to enable here - installing foot is enough.
#  - A wrapper at ~/.local/bin/foot shadows /usr/bin/foot: it focuses an
#    already-open foot window via a KWin script, otherwise opens a new window
#    with footclient (falling back to plain foot if the server socket is
#    absent); a desktop-entry override routes menu launches through it too.
#    Open windows are detected by their footclient processes, since the
#    always-running server is itself named "foot".
#  - zellij carries the ~/.tmux.conf bindings (prefix Ctrl-z) and options.
#  - bash line editing comes from ble.sh, with atuin history search riding its
#    hooks (added 2026-10-18). The load order in ~/.bashrc.d is load-bearing:
#    0_ble.sh sources ble.sh with --attach=none, zz_atuin.sh runs "atuin init"
#    (which sees BLE_VERSION and registers through blehook rather than
#    bash-preexec), and zzz_ble_attach.sh runs ble-attach last, as ble.sh
#    expects. ~/.bashrc itself only guards interactivity and sources
#    ~/.zellij.d (when outside zellij) and ~/.bashrc.d.
#  - fnm (from the forgejo registry, via sources_packages) replaces nvm.
#    ~/.zellij.d/fnm.sh exports FNM_DIR=~/.fnm and evals "fnm env" once per
#    session; "alias nvm=fnm" in ~/.bashrc.d/alias.sh keeps nvm muscle memory
#    working. The nvm hook (~/.zellij.d/nvm.sh) and its NVM_DIR export are
#    removed where found (added 2026-10-19).
#  - Only those three ~/.bashrc.d snippets, the nvm=fnm alias line, and
#    ~/.zellij.d/fnm.sh are managed here; the rest of both directories
#    (aliases, gpg, completion, session exports, tokens - never committed)
#    is personal and left alone.
#  - qtchooser points its tool shims (qdbus among them) at Qt6: the qt4/qt5
#    configs Ubuntu ships dangle, and /usr/lib/qt6/bin/qdbus is the only real
#    qdbus on the system, so plain "qdbus" fails without this.
#
# The packages themselves (foot, zellij, ble.sh, atuin, qdbus-qt6, fnm) come
# from sources_packages.

- name: "Configure foot, zellij and qtchooser for the desktop user"
  when: bootstrap_gui | default(false) | bool
  block:
    - name: "Create the user configuration directories"
      ansible.builtin.file:
        path: "/home/{{ terminal_user }}/{{ item }}"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rwx,g=rx,o=rx"
        state: "directory"
      loop:
        - ".bashrc.d"
        - ".config/foot"
        - ".config/qtchooser"
        - ".config/zellij"
        - ".local/bin"
        - ".local/share/applications"
        - ".zellij.d"

    - name: "Deploy .bashrc"
      ansible.builtin.copy:
        src: "bashrc"
        dest: "/home/{{ terminal_user }}/.bashrc"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"

    - name: "Deploy the bash line-editor stack (ble.sh + atuin)"
      ansible.builtin.copy:
        src: "bashrc.d/{{ item }}"
        dest: "/home/{{ terminal_user }}/.bashrc.d/{{ item }}"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"
      loop:
        - "0_ble.sh"
        - "zz_atuin.sh"
        - "zzz_ble_attach.sh"

    - name: "Deploy the fnm session hook"
      ansible.builtin.copy:
        src: "zellij.d/fnm.sh"
        dest: "/home/{{ terminal_user }}/.zellij.d/fnm.sh"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"

    - name: "Remove the nvm hook that fnm.sh replaces"
      ansible.builtin.file:
        path: "/home/{{ terminal_user }}/.zellij.d/nvm.sh"
        state: "absent"

    # 0_export.sh is personal (see above), so only the one stale line goes;
    # a host without the file is already clean.
    - name: "Remove the NVM_DIR export only nvm needed"
      ansible.builtin.lineinfile:
        path: "/home/{{ terminal_user }}/.zellij.d/0_export.sh"
        regexp: '^export NVM_DIR='
        state: "absent"

    - name: "Alias nvm to fnm"
      ansible.builtin.lineinfile:
        path: "/home/{{ terminal_user }}/.bashrc.d/alias.sh"
        regexp: "^alias nvm="
        line: "alias nvm='fnm'"
        create: true
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"

    - name: "Deploy foot.ini"
      ansible.builtin.copy:
        content: |
          # foot terminal configuration
          # Fullscreen, with the font sized so the screen holds 83 columns like Konsole
          # (83 columns gives emacs 80 text columns beside its line-number gutter).

          [main]
          font=Hack:size=29
          initial-window-mode=fullscreen
          # Source the session-scoped setup in ~/.zellij.d (exports, gpg unlock, fnm
          # PATH) once, so every pane inherits it without re-running it, then attach to
          # the persistent zellij session "main", creating it if needed, so a new foot
          # window resumes where the last one left off.
          shell=/bin/bash -c "for f in ~/.zellij.d/*.sh; do . $f; done; exec /usr/bin/zellij attach --create main"
        dest: "/home/{{ terminal_user }}/.config/foot/foot.ini"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"

    - name: "Deploy the single-instance foot wrapper"
      ansible.builtin.copy:
        src: "foot-wrapper"
        dest: "/home/{{ terminal_user }}/.local/bin/foot"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rwx,g=rx,o=rx"

    - name: "Deploy the foot desktop-entry override"
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Type=Application
          Exec=/home/{{ terminal_user }}/.local/bin/foot
          Icon=foot
          Terminal=false
          Categories=System;TerminalEmulator;
          Keywords=shell;prompt;command;commandline;
          SingleMainWindow=true

          Name=Foot
          GenericName=Terminal
          Comment=A wayland native terminal emulator
        dest: "/home/{{ terminal_user }}/.local/share/applications/foot.desktop"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"

    - name: "Deploy the zellij configuration"
      ansible.builtin.copy:
        src: "zellij-config.kdl"
        dest: "/home/{{ terminal_user }}/.config/zellij/config.kdl"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"

    - name: "Point qtchooser at Qt6"
      ansible.builtin.copy:
        content: |
          /usr/lib/qt6/bin
          /usr/lib/x86_64-linux-gnu
        dest: "/home/{{ terminal_user }}/.config/qtchooser/{{ item }}"
        owner: "{{ terminal_user }}"
        group: "{{ terminal_user }}"
        mode: "u=rw,g=r,o=r"
      loop:
        - "default.conf"
        - "qt6.conf"
