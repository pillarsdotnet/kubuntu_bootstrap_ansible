---
- name: "Install CUPS"
  ansible.builtin.apt:
    name:
      - "cups"
      - "cups-client"
      # Named explicitly because the estate depends on it and has not been
      # saying so: the USB printer is served as ipp://localhost:65431 by
      # ipp-usb, which udev starts when the printer appears. It arrives as a
      # recommendation of other packages on a desktop install, so it has been
      # present by luck rather than by declaration - and a host that acquires
      # the printer without it has CUPS running and no queue.
      - "ipp-usb"
    state: "present"
  tags:
    - "requires_systemd"

- name: "Deploy cupsd.conf"
  ansible.builtin.copy:
    content: |
      # Configuration file for the CUPS scheduler.  See "man cupsd.conf" for a
      # complete description of this file.

      LogLevel warn
      PageLogFormat

      MaxLogSize 0

      ErrorPolicy retry-job

      Port 631
      Listen /run/cups/cups.sock

      Browsing No
      BrowseLocalProtocols dnssd

      DefaultAuthType None

      WebInterface Yes

      IdleExitTimeout 60

      <Location />
        Order allow,deny
        Allow all
      </Location>

      <Location /admin>
        AuthType None
        Order allow,deny
        Allow all
      </Location>

      <Location /printers>
        AuthType None
        Order allow,deny
        Allow all
      </Location>

      <Location /jobs>
        AuthType None
        Order allow,deny
        Allow all
      </Location>

      <Policy default>
        JobPrivateAccess all
        JobPrivateValues default
        SubscriptionPrivateAccess all
        SubscriptionPrivateValues default

        <Limit All>
          Order allow,deny
          Allow all
        </Limit>
      </Policy>
    dest: "/etc/cups/cupsd.conf"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"
  notify: "Restart cups"
  tags:
    - "requires_systemd"

- name: "Deploy CUPS polkit rules"
  ansible.builtin.copy:
    content: |
      polkit.addRule(function(action, subject) {
          if (action.id.indexOf("org.opensuse.cupspkhelper.mechanism.") === 0 &&
              subject.local && subject.active) {
              return polkit.Result.YES;
          }
      });
    dest: "/etc/polkit-1/rules.d/50-cups-noauth.rules"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"
  notify: "Restart polkit"
  tags:
    - "requires_systemd"

- name: "Enable and start cups"
  ansible.builtin.systemd_service:
    name: "cups"
    enabled: true
    state: "started"
  tags:
    - "requires_systemd"

- name: "Check the ipp-usb port range is one ipp-usb will accept"
  ansible.builtin.assert:
    that: "printing_ipp_usb_min_port | int < printing_ipp_usb_max_port | int"
    fail_msg: >-
      ipp-usb requires http-min-port to be strictly less than http-max-port
      and exits at startup otherwise, with "http-min-port must be less that
      http-max-port". Measured on homelab 2026-11-24: setting both to 65431
      stopped the daemon and took eSCL off the network until it was reverted.
      A one-port range is not how the port is pinned - ipp-usb already takes
      the lowest free port in the range.
    success_msg: "ipp-usb port range spans at least two ports"

# A dpkg conffile, so dpkg will keep this version and leave a .dpkg-dist
# alongside it on a future ipp-usb upgrade rather than overwriting it. Worth
# knowing when a new release adds a setting: it will not appear here by itself.
- name: "Deploy ipp-usb.conf"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/printing). Do not edit by hand.
      # The packaged file is mostly commented examples; this is only what the
      # fleet actually sets. See roles/printing/defaults/main.yml for why.

      [network]
        http-min-port = {{ printing_ipp_usb_min_port }}
        http-max-port = {{ printing_ipp_usb_max_port }}
        dns-sd = {{ printing_ipp_usb_dns_sd }}
        interface = {{ printing_ipp_usb_interface }}
        ipv6 = {{ printing_ipp_usb_ipv6 }}

      [auth uid]
        all = *

      [logging]
        device-log = {{ printing_ipp_usb_device_log }}
        main-log = {{ printing_ipp_usb_log_level }}
        console-log = {{ printing_ipp_usb_log_level }}
        max-file-size = 256K
        max-backup-files = 5
        console-color = enable
        get-all-printer-attrs = false
    dest: "/etc/ipp-usb/ipp-usb.conf"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"
  notify: "Restart ipp-usb"
  tags:
    - "requires_systemd"

- name: "Configure the SANE net backend for networked scanners"
  when: printing_sane_net_hosts | length > 0
  block:
    - name: "Enable the SANE net backend"
      ansible.builtin.lineinfile:
        path: "/etc/sane.d/dll.conf"
        regexp: "^\\s*#?\\s*net\\s*$"
        line: "net"
        state: "present"
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r"

    - name: "Deploy SANE net.conf"
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (roles/printing). Hosts running saned.
          {% for scanner_host in printing_sane_net_hosts %}
          {{ scanner_host }}
          {% endfor %}
        dest: "/etc/sane.d/net.conf"
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r"
