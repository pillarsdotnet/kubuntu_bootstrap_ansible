---
# Extra names this host's CUPS answers to, beyond the ones it accepts on its
# own. CUPS checks the Host: header of every request and replies "400 Bad
# Request" to a name it does not recognise. It recognises its own hostname,
# its IP addresses, and anything ending in ".local" - and nothing else, not
# even its own fully qualified ".lan" name.
#
# That matters when one host borrows another's address, which
# roles/bootstrap/tasks/ip_alias.yml exists to do: the borrowed ADDRESS works
# and the borrowed NAME returns 400, so a queue pointed at
# ipp://<other-host>:631 reports "Unable to get printer status" and holds the
# job. The address is right, the printer is healthy, and nothing in the error
# mentions hostnames. Measured on acermagic 2026-11-25, with the printer
# already moved and the queue on bobse16 still addressing it as "homelab".
#
# Set this wherever bootstrap_extra_addresses is set, to the NAMES that
# resolve to those addresses.
printing_cups_server_aliases: []

# Hosts running saned, for the SANE net backend. Empty means "this host has no
# networked scanner", and the net backend configuration is left alone.
#
# Set this per host in host_vars/<hostname>.yml, which git excludes: a scanner
# address is site wiring, not fleet policy, and a wrong one does not fail fast.
# The net backend blocks on TCP connect, so a stale address hangs every SANE
# client on the machine rather than reporting an error.
printing_sane_net_hosts: []

# ipp-usb presents a USB printer that speaks IPP-over-USB as a local IPP
# service, and - the part that is easy to miss - as a local eSCL scanner too.
# That is how a scanner with no network connection of its own ends up
# reachable as "net:<host>:airscan:...", which looks like a network device and
# is not one.
#
# "loopback" keeps it on 127.0.0.1, which is right for a desktop. "all" puts
# it on every interface so other machines can scan directly rather than
# through saned on this host; see printing_sane_net_hosts above for the proxy
# route it replaces.
printing_ipp_usb_interface: "loopback"

# The port range ipp-usb allocates from, one port per device, lowest free
# first. These are the packaged values.
#
# The range must span at least two ports: ipp-usb requires http-min-port to be
# strictly less than http-max-port and refuses to start otherwise. It is not a
# way to pin the port, and it does not need to be - with one device attached
# the lowest port in the range is always the one chosen.
printing_ipp_usb_min_port: 65431
printing_ipp_usb_max_port: 65432

# Advertise over DNS-SD, so clients that browse find the printer and scanner.
printing_ipp_usb_dns_sd: "enable"
# ipp-usb offers no interface list and no access control of its own - only
# "all" or "loopback" above, and this. So on a host that shares eSCL, turning
# IPv6 off is the only lever the daemon has for keeping the endpoint off a
# globally routable address; anything finer needs a host firewall.
printing_ipp_usb_ipv6: "enable"

# "debug" is what the package ships, and it is noisy - every scan and every
# probe lands in /var/log/ipp-usb. Lowered to "info" or "error" it stays quiet;
# left here as shipped so templating this file changes no behaviour on a host
# that already had it.
printing_ipp_usb_log_level: "debug"
printing_ipp_usb_device_log: "all"
