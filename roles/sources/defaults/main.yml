      suites: "resolute"
    pipewire:
      fingerprint: "fc43b7352bcc0ec8af2eeb8b25088a0359807596"
      server: "https://ppa.launchpadcontent.net/pipewire-debian/pipewire-upstream"
      suites: "oracular"
    slack:
      server: "https://packagecloud.io/slacktechnologies/slack"
      signed_by: "/gpgkey"
      suites: "jessie"
      uris: "/debian"
    steam:
      arch: "amd64 i386"
      components: "steam"
      server: "https://repo.steampowered.com/steam/"
      signed_by: "/archive/stable/steam.gpg"
      suites: "beta stable"
      uris: ""
    tlp:
      fingerprint: "6d5ad4d9aab22d292623db0730930746f32935f2"
      server: "https://ppa.launchpadcontent.net/linrunner/tlp"
      suites: "plucky"
    waydroid:
