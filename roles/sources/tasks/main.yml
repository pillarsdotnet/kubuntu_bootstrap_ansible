---
# The ubuntu repo carries "Architectures: amd64 i386" for Steam's 32-bit
# runtime, but apt will not resolve i386 packages unless dpkg also accepts the
# architecture. Do this before the sources are written so the first update_cache
# below already sees a usable i386 index.
- name: "Check which foreign dpkg architectures are enabled"
  ansible.builtin.command:
    cmd: "dpkg --print-foreign-architectures"
  changed_when: false
  register: "sources_foreign_arches"
- name: "Enable the i386 architecture for Steam's 32-bit runtime"
  ansible.builtin.command:
    cmd: "dpkg --add-architecture i386"
  when: "'i386' not in sources_foreign_arches.stdout_lines"
# The "vdi" profile adds its curated list to whatever skip_repos/skip_packages
# already hold, so an explicit -e "skip_repos=[...]" still applies on top of a
# profile rather than being replaced by it. (The previous form assigned
# skip_repos from skip_repos, which cannot resolve: set_fact may not read the
# variable it is defining.)
- name: "Determine repositories and packages to skip based on environment profile"
  ansible.builtin.set_fact:
    sources_skip_packages: >-
      {{ (skip_packages +
          (vdi_skip_packages if environment_profile == 'vdi' else [])) | unique }}
    sources_skip_repos: >-
      {{ (skip_repos +
          (vdi_skip_repos if environment_profile == 'vdi' else [])) | unique }}

# Check both groups, not just the ones this host uses, so a typo in a desktop
# repo fails on a server run too rather than waiting for the next desktop.
- name: "Check that every repository uses only keys the template reads"
  ansible.builtin.assert:
    that:
      - "item.value.keys() | difference(sources_repo_keys) | length == 0"
      - "'server' in item.value"
      - "'fingerprint' in item.value or 'signed_by' in item.value"
    fail_msg: >-
      sources_repos entry "{{ item.key }}" has unknown keys
      {{ item.value.keys() | difference(sources_repo_keys) | list }}, or lacks
      "server" or a "fingerprint"/"signed_by". Allowed keys:
      {{ sources_repo_keys | join(', ') }}.
    quiet: true
  loop: "{{ sources_repos.values() | map('dict2items') | flatten(levels=1) }}"
  loop_control:
    label: "{{ item.key }}"

# A host already on stonking that is later run as a VDI would otherwise get
# resolute sources, and the full upgrade below cannot go backwards from there.
# A release missing from the list (an older WSL install, say) is not checked.
- name: "Check that the target Ubuntu release is not older than the running one"
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.distribution_release not in sources_ubuntu_releases or
        sources_ubuntu_releases.index(ansible_facts.distribution_release) <=
        sources_ubuntu_releases.index(sources_ubuntu_release)
    fail_msg: >-
      This host runs {{ ansible_facts.distribution_release }}, but the sources
      would be written for the older {{ sources_ubuntu_release }}.
    quiet: true

- name: "Filter repositories based on environment profile"
  ansible.builtin.set_fact:
    filtered_repos: "{{ repos | dict2items | rejectattr('key', 'in', sources_skip_repos) | list | items2dict }}"
  vars:
    repos: "{{ sources_repos.common | combine(\
      sources_repos.desktop if bootstrap_gui | bool else {}\
      ) }}"

- name: "Write source repos /etc/apt/sources.list.d/ folder"
  ansible.builtin.template:
    src: "sources.j2"
    dest: "/etc/apt/sources.list.d/{{ item.key }}.sources"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"
  loop: "{{ filtered_repos | dict2items }}"

- name: "Remove unmanaged .sources files from /etc/apt/sources.list.d/ (VDI cleanup)"
  ansible.builtin.shell:
    cmd: |
      set -e
      managed_repos="{{ filtered_repos.keys() | list | join(' ') }}"
      for file in /etc/apt/sources.list.d/*.sources; do
        # An unmatched glob expands to the pattern itself; without this the
        # literal "*" would be reported as a removal on a host with no
        # .sources files at all.
        [ -e "$file" ] || continue
        basename_noext=$(basename "$file" .sources)
        found=0
        for managed in $managed_repos; do
          if [ "$basename_noext" = "$managed" ]; then
            found=1
            break
          fi
        done
        if [ $found -eq 0 ]; then
          echo "Removing unmanaged repository: $basename_noext"
          rm -f "$file"
        fi
      done
  register: "sources_unmanaged"
  # This task deletes repo files, so it must not report "ok" unconditionally:
  # dropping a host from the desktop set removes every desktop .sources file
  # here, and a recap that always says "ok" hides that entirely. The loop echoes
  # one line per file it removes and nothing otherwise, so its own output is the
  # changed signal.
  changed_when: "'Removing unmanaged repository:' in sources_unmanaged.stdout"
  tags:
    - "vdi-cleanup"
- name: "Write apt pins to /etc/apt/preferences.d/ folder"
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/etc/apt/preferences.d/{{ item.key }}"
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"
  loop: "{{ sources_preferences | dict2items }}"
- name: "Ensure /etc/apt/sources.list.distrib directory exists"
  ansible.builtin.file:
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
    owner: "root"
    path: "/etc/apt/sources.list.distrib"
    state: "directory"
- name: "Create a README file in this directory to describe its purpose"
  ansible.builtin.copy:
    content: |
      We prefer Deb822-style Format to the traditional One-Line-Style Format.
      To prevent conflicts in the case of packages which auto-update their
      corresponding `.list` file, we install a script which automatically moves
      any `.list` files to this directory after each apt install.
      See:
      - https://repolib.readthedocs.io/en/latest/deb822-format.html
      - /etc/apt/apt.conf.d/99move-list-files.conf
    dest: "/etc/apt/sources.list.distrib/README"
    group: "root"
    mode: "u=rw,g=r,o=r"
    owner: "root"
- name: "Move conflicting sources files out of the way after each dpkg run"
  ansible.builtin.copy:
    content: |
      DPkg::Post-Invoke {
        "mv -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.distrib/ 2>/dev/null || true";
      };
    dest: "/etc/apt/apt.conf.d/99move-list-files.conf"
    mode: "u=rwx,g=r,o=r"
- name: "Register 1password sources divert"
  ansible.builtin.command: >-
    dpkg-divert --local
    --divert /etc/apt/sources.list.distrib/1password.sources
    /etc/apt/sources.list.d/1password.sources
  register: divert_1password_result
  changed_when: "'Adding' in divert_1password_result.stdout"
- name: "Remove obsolete sources files that conflict with managed repos"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: "absent"
  loop: "{{ sources_obsolete }}"
- name: "Upgrade existing packages"
  ansible.builtin.apt:
    auto_install_module_deps: true
    clean: true
    install_recommends: true
    update_cache: true
    upgrade: "full"
  tags:
    - "requires_systemd"
- name: "Install new packages"
  ansible.builtin.apt:
    auto_install_module_deps: true
    autoremove: true
    clean: true
    install_recommends: true
    name: "{{ filtered_packages }}"
    state: "present"
  ignore_errors: true
  tags:
    - "install_optional_packages"
  vars:
    vdi_extra_packages: "{{ ['1password-cli'] if environment_profile == 'vdi' else [] }}"
    all_packages: >-
      {{ sources_packages.common + extra + vdi_extra_packages
         + [sources_mail_transport_agent] }}
    extra: >-
      {{ sources_packages.desktop if bootstrap_gui | bool
         else sources_packages.headless }}
    filtered_packages: "{{ (all_packages | reject('in', sources_skip_packages) | list) | unique }}"
# After the install, which enables each package's service and would
# otherwise start one this host does not use.
- name: "Stop and disable services this host does not use"
  ansible.builtin.systemd_service:
    enabled: false
    name: "{{ item }}"
    state: "stopped"
  loop: "{{ sources_disabled_services }}"
  tags:
    - "requires_systemd"
# Before DisplayLink, so EVDI is not built for kernels about to be purged.
- name: "Purge old kernels and their boot entries"
  ansible.builtin.include_tasks: "kernels.yml"
  when: not (sources_wsl | bool)
- name: "Install the DisplayLink USB graphics driver"
  when: bootstrap_gui | bool and environment_profile != "vdi"
  tags:
    - "requires_systemd"
  block:
    - name: "Ensure the DisplayLink download directory exists"
      ansible.builtin.file:
        group: "root"
        mode: "u=rwx,g=rx,o=rx"
        owner: "root"
        path: "{{ sources_displaylink.cache }}"
        state: "directory"
    - name: "Download the DisplayLink installer archive"
      ansible.builtin.get_url:
        checksum: "{{ sources_displaylink.checksum }}"
        dest: "{{ sources_displaylink.cache }}/displaylink-{{ sources_displaylink.version }}.zip"
        group: "root"
        mode: "u=rw,g=r,o=r"
        owner: "root"
        url: "{{ sources_displaylink.url }}"
    - name: "Unpack the DisplayLink installer archive"
      ansible.builtin.unarchive:
        creates: "{{ sources_displaylink.cache }}/displaylink-driver-{{ sources_displaylink.version }}.run"
        dest: "{{ sources_displaylink.cache }}"
        remote_src: true
        src: "{{ sources_displaylink.cache }}/displaylink-{{ sources_displaylink.version }}.zip"
    - name: "Extract the DisplayLink installer payload"
      ansible.builtin.command:
        chdir: "{{ sources_displaylink.cache }}"
        cmd: >-
          /bin/sh displaylink-driver-{{ sources_displaylink.version }}.run
          --noexec --target payload-{{ sources_displaylink.version }}
        creates: "{{ sources_displaylink.cache }}/payload-{{ sources_displaylink.version }}/displaylink-installer.sh"
    # See sources_displaylink in defaults/main.yml for why the bundled EVDI
    # module is replaced and the bundled library kept.
    - name: "Download the upstream EVDI source"
      ansible.builtin.get_url:
        checksum: "{{ sources_displaylink.evdi.checksum }}"
        dest: "{{ sources_displaylink.cache }}/evdi-{{ sources_displaylink.evdi.version }}.tar.gz"
        group: "root"
        mode: "u=rw,g=r,o=r"
        owner: "root"
        url: "{{ sources_displaylink.evdi.url }}"
    - name: "Check which EVDI module the DisplayLink payload bundles"
      ansible.builtin.shell:
        chdir: "{{ sources_displaylink.cache }}/payload-{{ sources_displaylink.version }}"
        cmd: >-
          tar xzOf evdi.tar.gz --wildcards '*module/dkms.conf'
          | sed -n 's/^PACKAGE_VERSION=//p'
      changed_when: false
      register: "sources_displaylink_bundled_evdi"
    - name: "Replace the bundled EVDI module with the upstream one"
      ansible.builtin.shell:
        chdir: "{{ sources_displaylink.cache }}/payload-{{ sources_displaylink.version }}"
        cmd: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/bundle" "$work/upstream"
          tar xzf evdi.tar.gz -C "$work/bundle"
          tar xzf ../evdi-{{ sources_displaylink.evdi.version }}.tar.gz \
            -C "$work/upstream" --strip-components=1
          rm -rf "$work/bundle/module"
          cp -a "$work/upstream/module" "$work/bundle/module"
          tar czf evdi.tar.gz.new -C "$work/bundle" .
          mv evdi.tar.gz.new evdi.tar.gz
      when: sources_displaylink_bundled_evdi.stdout != sources_displaylink.evdi.version
    - name: "Check which DisplayLink version is already installed"
      ansible.builtin.command:
        cmd: "/opt/displaylink/DisplayLinkManager -version"
      changed_when: false
      failed_when: false
      register: "sources_displaylink_current"
    - name: "Check which EVDI modules DKMS holds"
      ansible.builtin.command:
        cmd: "dkms status -m evdi"
      changed_when: false
      register: "sources_displaylink_dkms"
    - name: "Run the DisplayLink installer"
      ansible.builtin.command:
        chdir: "{{ sources_displaylink.cache }}/payload-{{ sources_displaylink.version }}"
        cmd: "./displaylink-installer.sh noreboot"
        stdin: "n"
      register: "sources_displaylink_install"
      changed_when: "sources_displaylink_install.rc == 0"
      when: >-
        sources_displaylink.release
        not in (sources_displaylink_current.stdout | default(""))
        or ('evdi/' ~ sources_displaylink.evdi.version ~ ',')
        not in sources_displaylink_dkms.stdout
      ignore_errors: true
    # The installer removes only an earlier copy of its own EVDI version, so a
    # replaced one stays in DKMS and is rebuilt for every new kernel - which is
    # how 1.14.15 broke the 7.3 kernel's postinst. Remove all but the pinned
    # version, and only once that one is installed, so EVDI is never missing.
    # The installer builds EVDI for the running kernel only. Build it for the
    # rest too, before the old version is removed below, or booting any other
    # installed kernel would leave DisplayLink with no module at all. This
    # fails if the installer above did not add the pinned version to DKMS,
    # which its ignore_errors would otherwise hide.
    - name: "Build the pinned EVDI module for every installed kernel"
      ansible.builtin.shell:
        cmd: |
          set -eu
          for build in /lib/modules/*/build; do
            [ -d "$build" ] || continue
            kernel=$(basename "$(dirname "$build")")
            if ! dkms status -m evdi -v {{ sources_displaylink.evdi.version }} \
                -k "$kernel" | grep -q installed; then
              dkms install evdi/{{ sources_displaylink.evdi.version }} -k "$kernel"
              echo "built for $kernel"
            fi
          done
      register: "sources_displaylink_evdi_kernels"
      changed_when: "'built for' in sources_displaylink_evdi_kernels.stdout"
    - name: "Check which EVDI modules DKMS holds after installing"
      ansible.builtin.command:
        cmd: "dkms status -m evdi"
      changed_when: false
      register: "sources_displaylink_dkms_after"
    - name: "Remove EVDI versions other than the pinned one from DKMS"
      ansible.builtin.command:
        cmd: "dkms remove evdi/{{ item }} --all"
      loop: >-
        {{ sources_displaylink_dkms_after.stdout_lines
           | map('regex_search', '^evdi/([^,:]+)[,:]', '\1') | select | map('first')
           | reject('eq', sources_displaylink.evdi.version) | unique }}
      when: >-
        ('evdi/' ~ sources_displaylink.evdi.version ~ ',')
        in sources_displaylink_dkms_after.stdout
