---
- name: "Hibernation"
  become: true
  gather_facts: true
  hosts: all
  pre_tasks:
    # Only when the variable is unset. A host that cannot hibernate sets
    # hibernation_uuid to a non-UUID value such as "disabled" to skip both the
    # prompt and the role; see README.md, "Opting a host out".
    - name: "Prompt for the hibernation partition"
      ansible.builtin.pause:
        prompt: "Enter the UUID of the hibernation partition:"
      register: "hibernation_uuid_prompt"
      when: hibernation_uuid is not defined
    - name: "Set hibernation_uuid"
      ansible.builtin.set_fact:
        hibernation_uuid: |
          {{ hibernation_uuid_prompt.user_input }}
      when: >
        hibernation_uuid_prompt            is defined and
        hibernation_uuid_prompt.user_input is defined
  roles:
    - "hibernation"
