---
- name: "Bootstrap"
  ansible.builtin.import_playbook: "bootstrap.yml"
- name: "Hibernation"
  ansible.builtin.import_playbook: "hibernation.yml"
- name: "Setup"
  become: true
  hosts: all
  gather_facts: true
  roles:
    # First: the roles after this one install packages and reach registries,
    # so name resolution should be settled before they run. Off everywhere by
    # default; see roles/resolver/defaults/main.yml.
    - "resolver"
    - "sources"
    # Must follow "sources", which installs docker.io. A no-op on every host
    # that does not set docker_daemon_config; see roles/docker/defaults.
    - "docker"
    # - "kubernetes"
    # Off for every host but the one that asked for it; see
    # roles/diagnostics/defaults/main.yml.
    - "diagnostics"
    # Off everywhere but the host whose board leaves a CPU fan at full
    # duty; see roles/fancontrol/defaults/main.yml. Tagged so it can be run
    # on its own: it builds an out-of-tree kernel module, which is worth
    # being able to redo after a kernel update without a full setup run.
    - role: "fancontrol"
      tags: ["fancontrol"]
    # Off everywhere but the host with a UPS on its USB port; see
    # roles/nut/defaults/main.yml. Tagged for the same reason as fancontrol:
    # the UPS identity comes from "nut-scanner -U" on the host, so it is worth
    # being able to re-apply the role on its own after swapping a unit.
    - role: "nut"
      tags: ["nut"]
    # Also off everywhere by default. Exists so the forge can be stood up on
    # a second host while its usual one is unavailable; see
    # roles/forgejo/defaults/main.yml. Tagged because a migration is a
    # sequence of deliberate steps - restore, then certificate, then runner -
    # and each wants re-running without the rest of a setup pass.
    - role: "forgejo"
      tags: ["forgejo"]
    # Tagged for the same reason as fileserver below: moving the printer to
    # another host is a change to one role, and a full setup run on a host
    # that is only acquiring a printer is a lot of unrelated risk.
    - role: "printing"
      tags: ["printing"]
    # Off everywhere but the host asked to serve shares; see
    # roles/fileserver/defaults/main.yml. After "printing" because both
    # install packages and neither depends on the other. Tagged so a share can
    # be added without a full setup run.
    - role: "fileserver"
      tags: ["fileserver"]
    # Both off everywhere but the host asked to serve them, and both exist for
    # the same reason as "forgejo" above: a service that normally lives on
    # homelab needs somewhere else to be while that host is away. Tagged for
    # the same reason too - a move is a sequence of deliberate steps.
    - role: "calibre"
      tags: ["calibre", "books"]
    - role: "foundry"
      tags: ["foundry", "game"]
    # Keeps this site's dynamic DNS records current. Early enough to matter
    # and late enough that the network is settled; off everywhere but the one
    # host at a site that owns the job. See roles/ddns/defaults/main.yml.
    - role: "ddns"
      tags: ["ddns"]
    # The shared compiler-object cache CI pulls from. Off everywhere but the
    # host running the runners; see roles/sccache/defaults/main.yml.
    - role: "sccache"
      tags: ["sccache"]
    # Receives the Home Library hourly disaster copy. Installs no library and
    # serves nothing; see roles/library_peer/defaults/main.yml.
    - role: "library_peer"
      tags: ["library_peer"]
    - "terminal"
  post_tasks:
    # Package installation can add or enable units after bootstrap has run.
    - name: "Reapply the WSL service policy after installing packages"
      ansible.builtin.import_role:
        name: "bootstrap"
        tasks_from: "wsl_services"
