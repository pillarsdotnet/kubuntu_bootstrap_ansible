---
- name: "Bootstrap"
  ansible.builtin.import_playbook: "bootstrap.yml"
- name: "Hibernation"
  ansible.builtin.import_playbook: "hibernation.yml"
- name: "Setup"
  become: true
  hosts: all
  gather_facts: true
  roles:
    - "sources"
    - "tailscale"
    # - "kubernetes"
    - "printing"
    - "terminal"
  post_tasks:
    # Package installation can add or enable units after bootstrap has run.
    - name: "Reapply the WSL service policy after installing packages"
      ansible.builtin.import_role:
        name: "bootstrap"
        tasks_from: "wsl_services"
