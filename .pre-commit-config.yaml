---
# Run "pre-commit install" once per clone to enable these hooks on git commit.
# The hook uses the project's pinned venv tooling (see requirements.txt); create
# it with "uv venv && uv pip install -r requirements.txt".
repos:
  - repo: "local"
    hooks:
      - id: "ansible-lint"
        name: "ansible-lint"
        # The whole rule set, not just the formatting tags. This hook used to
        # pass "--tags formatting" because the repository carried 38 findings
        # the full run would have failed on: 21 var-naming[no-role-prefix], 9
        # risky-shell-pipe, 7 no-changed-when and one command-instead-of-module.
        # Those are fixed, so the full run gates from here and new ones cannot
        # accumulate unseen. ansible-lint parses every task file, including the
        # ones pulled in via include_tasks, so it still catches the load and
        # syntax errors that "ansible-playbook --syntax-check" silently skips
        # for dynamic includes.
        # It runs from .venv, whose ansible-lint requirements.txt pins, so this
        # and the Lint workflow check the same rules with the same version.
        # Force a UTF-8 locale first: Ansible aborts on a non-UTF-8 locale (e.g.
        # a stray LC_ALL=C) before parsing anything. C.UTF-8 needs no locale-gen.
        entry: "env LC_ALL=C.UTF-8 LANG=C.UTF-8 .venv/bin/ansible-lint"
        language: "system"
        types: ["yaml"]
        require_serial: true
      - id: "jinja-syntax-check"
        name: "jinja template syntax check"
        # ansible-lint does not parse standalone .j2 template bodies; this script
        # parses each one with Jinja2 to catch malformed markup.
        entry: ".venv/bin/python scripts/check-jinja-syntax.py"
        language: "system"
        files: '\.j2$'
        require_serial: true
      - id: "vale"
        name: "vale"
        # The PyPI "vale" package wraps the official binary, so pre-commit
        # installs it into the hook's own environment - nothing to install by
        # hand, locally or in CI. CLAUDE.md and .claude/ are instructions for
        # an agent, not prose for people, so they stay out of the prose check.
        entry: vale
        language: python
        additional_dependencies: ["vale==3.19.0.0"]
        types: [markdown]
        exclude: ^(CLAUDE\.md|\.claude/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^(filter_plugins|scripts)/
        additional_dependencies:
          # The jinja-syntax-check script imports jinja2; install it into the
          # hook's isolated environment so mypy can follow the (typed) import.
          - jinja2

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        # Markdown only: the YAML belongs to ansible-lint and yamllint, and
        # letting prettier reformat fifty role files would bury real diffs.
        types_or: [markdown]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
